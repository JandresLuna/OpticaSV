
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica S&V | Salud y Estilo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --refraction-1: rgba(45, 212, 191, 0.15);
            --refraction-2: rgba(168, 85, 247, 0.15);
            --brand-blue: #1e56a0; /* Inspired by the blue card in reference */
            --bg-ivory: #fafafa;
            --text-dark: #121212;
            --titanium: #E5E7EB;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-ivory);
            color: var(--text-dark);
            scroll-behavior: smooth;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .prism-grid {
            background-image: 
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glass-vellum {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .titanium-border {
            border: 1px solid #d1d5db;
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .chat-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .chat-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        .hero-blue-card {
            background-color: var(--brand-blue);
            border-radius: 3rem;
            position: relative;
            overflow: hidden;
        }

        .btn-brand-blue {
            background-color: var(--brand-blue);
            color: white;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .btn-brand-blue:hover {
            transform: translateY(-2px);
            background-color: #16427d;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="prism-grid">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
